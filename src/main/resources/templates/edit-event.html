<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Event</title>
    <link rel="stylesheet" href="quest.css">
</head>
<body>

<div class="container">

    ```
    <div class="header">

        <h1>Edit Event</h1>

        <a href="/admin/events" class="back-btn">
            Back
        </a>

    </div>

    <form th:action="@{/admin/events/edit}"
          th:object="${eventData}"
          th:method="PUT"
          class="quest-form">

        <div class="form-group">

            <label>Select Event</label>

            <select th:field="*{id}">

                <option th:each="event : ${events}"
                        th:value="${event.id}"
                        th:text="${event.title}">
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>Event title</label>

            <input type="text"
                   th:field="*{title}">

            <p class="error"
               th:if="${#fields.hasErrors('title')}"
               th:errors="*{title}">
            </p>

        </div>

        <div class="form-group">

            <label>Description</label>

            <textarea th:field="*{description}">
        </textarea>

            <p class="error"
               th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}">
            </p>

        </div>

        <div class="form-group">

            <label>Bonus XP</label>

            <input type="number"
                   min="0"
                   th:field="*{bonusXp}">

            <p class="error"
               th:if="${#fields.hasErrors('bonusXp')}"
               th:errors="*{bonusXp}">
            </p>

        </div>

        <div class="form-group">

            <label>Bonus Gold</label>

            <input type="number"
                   min="0"
                   th:field="*{bonusGold}">

            <p class="error"
               th:if="${#fields.hasErrors('bonusGold')}"
               th:errors="*{bonusGold}">
            </p>

        </div>

        <div class="form-group">

            <label for="affectedQuestType">Affected Quest Type</label>

            <select id="affectedQuestType"
                    th:field="*{affectedQuestType}">

                <option value="">Select type</option>
                <option value="COMBAT">Combat</option>
                <option value="MAGIC">Magic</option>
                <option value="STEALTH">Stealth</option>
                <option value="SUPPORT">Support</option>

            </select>

            <p class="error"
               th:if="${#fields.hasErrors('affectedQuestType')}"
               th:errors="*{affectedQuestType}">
            </p>

        </div>

        <div class="form-group">

            <label for="start">Start Time</label>

            <input type="datetime-local"
                   id="start"
                   th:field="*{start}">

            <p class="error"
               th:if="${#fields.hasErrors('start')}"
               th:errors="*{start}">
            </p>

        </div>

        <div class="form-group">

            <label for="end">End Time</label>

            <input type="datetime-local"
                   id="end"
                   th:field="*{end}">

            <p class="error"
               th:if="${#fields.hasErrors('end')}"
               th:errors="*{end}">
            </p>

        </div>

        <button type="submit"
                class="submit-btn">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
