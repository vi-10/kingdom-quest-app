<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/css/admin-action.css">
</head>
<body>

<div class="container">

    <div class="header">

        <h1>Edit Profile</h1>

        <a href="/dashboard" class="back-btn">
            Back
        </a>

    </div>

    <form th:action="@{/edit}"
          th:object="${editData}"
          th:method="PUT"
          class="quest-form">

        <div class="form-group">

            <label for="username">Username</label>

            <input type="text"
                   id="username"
                   th:field="*{username}">

            <p class="error"
               th:if="${#fields.hasErrors('username')}"
               th:errors="*{username}">
            </p>

        </div>

        <div class="form-group">

            <label for="email">Email</label>

            <input type="email"
                   id="email"
                   th:field="*{email}">

            <p class="error"
               th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}">
            </p>

        </div>

        <div class="form-group">

            <label for="profilePicture">Profile Picture URL</label>

            <input type="text"
                   id="profilePicture"
                   th:field="*{profilePicture}">

        </div>

        <div class="form-group">

            <label for="roleplayName">Roleplay Name</label>

            <input type="text"
                   id="roleplayName"
                   th:field="*{roleplayName}">

            <p class="error"
               th:if="${#fields.hasErrors('roleplayName')}"
               th:errors="*{roleplayName}">
            </p>

        </div>

        <button type="submit"
                class="submit-btn">
            Save Changes
        </button>

    </form>

</div>

</body>
</html>
